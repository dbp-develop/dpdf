name: Build & Release dpdf (Windows & macOS)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installers
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build dpdf binaries
        run: |
          cargo build --release -p dpdf -p dpdf-cli --target x86_64-pc-windows-msvc

      - name: Stage release files
        shell: pwsh
        run: |
          $BinDir = "target/x86_64-pc-windows-msvc/release"
          $Stage = "target/windows-package/stage"
          New-Item -ItemType Directory -Force -Path $Stage | Out-Null
          New-Item -ItemType Directory -Force -Path "dist/release" | Out-Null
          Copy-Item "$BinDir\dpdf.exe", "$BinDir\dpdf-cli.exe" $Stage
          Copy-Item "LICENSE-MIT", "LICENSE-APACHE", "NOTICE" $Stage
          Copy-Item "assets/app-icon/LICENSE-document.txt" $Stage
          $Models = "target/windows-package/models"
          New-Item -ItemType Directory -Force -Path $Models | Out-Null
          if (-not (Test-Path "$Models\ATTRIBUTION.txt")) {
            Set-Content "$Models\ATTRIBUTION.txt" "Local OCR models"
          }

      - name: Package Portable Version (.zip)
        shell: pwsh
        run: |
          $BinDir = "target/x86_64-pc-windows-msvc/release"
          $PortableDir = "target/windows-package/dpdf-portable"
          New-Item -ItemType Directory -Force -Path $PortableDir | Out-Null
          Copy-Item "$BinDir\dpdf.exe", "$BinDir\dpdf-cli.exe" $PortableDir
          Copy-Item "LICENSE-MIT", "LICENSE-APACHE", "NOTICE", "README.md" $PortableDir
          Set-Content "$PortableDir\portable.txt" "dpdf portable mode"
          Compress-Archive -Path "$PortableDir\*" -DestinationPath "dist/release/dpdf-2.0.0-windows-x64-portable.zip" -Force

      - name: Set up Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile Inno Setup Installer (.exe)
        shell: pwsh
        run: |
          iscc /D"BinDir=..\..\target\windows-package\stage" /D"MyAppVersion=2.0.0" packaging/windows/dpdf.iss

      - name: Set up WiX Toolset
        run: dotnet tool install --global wix --version 5.0.2

      - name: Compile WiX MSI Installer (.msi)
        shell: pwsh
        run: |
          $Stage = (Resolve-Path "target/windows-package/stage").Path
          $Models = (Resolve-Path "target/windows-package/models").Path
          $Icon = (Resolve-Path "assets/app-icon/dpdf.ico").Path
          wix build packaging/windows/dpdf.wxs `
            packaging/windows/installer-ui.wxs `
            -arch x64 `
            -d "Version=2.0.0" `
            -d "BinDir=$Stage" `
            -d "ModelsDir=$Models" `
            -d "IconPath=$Icon" `
            -o dist/release/dpdf-2.0.0-windows-x64.msi

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v7
        with:
          name: dpdf-windows-installers
          path: |
            dist/release/dpdf-*.exe
            dist/release/dpdf-*.msi
            dist/release/dpdf-*.zip

  build-macos:
    name: Build macOS Universal Installers
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build dpdf binaries for Apple Silicon and Intel
        run: |
          cargo build --release -p dpdf -p dpdf-cli --target aarch64-apple-darwin
          cargo build --release -p dpdf -p dpdf-cli --target x86_64-apple-darwin

      - name: Package macOS Universal App & DMG
        run: |
          set -euo pipefail
          mkdir -p target/universal/release
          lipo -create -output target/universal/release/dpdf target/aarch64-apple-darwin/release/dpdf target/x86_64-apple-darwin/release/dpdf
          lipo -create -output target/universal/release/dpdf-cli target/aarch64-apple-darwin/release/dpdf-cli target/x86_64-apple-darwin/release/dpdf-cli

          # Assemble dpdf.app
          APP="target/macos-package/dpdf.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/universal/release/dpdf "$APP/Contents/MacOS/dpdf"
          chmod +x "$APP/Contents/MacOS/dpdf"
          cp assets/app-icon/dpdf.icns "$APP/Contents/Resources/dpdf.icns"
          if [ -f packaging/macos/Credits.rtf ]; then
            cp packaging/macos/Credits.rtf "$APP/Contents/Resources/Credits.rtf"
          fi
          sed -e "s/@VERSION@/2.0.0/g" -e "s/@SHORT_VERSION@/2.0.0/g" -e "s/@BUILD_SHA@/${{ github.sha }}/g" packaging/macos/Info.plist.in > "$APP/Contents/Info.plist"
          printf 'APPL????' > "$APP/Contents/PkgInfo"

          # Ad-hoc sign app bundle
          codesign --force --deep --sign - "$APP"

          # Create DMG
          mkdir -p dist/release target/dmg-stage
          ditto "$APP" target/dmg-stage/dpdf.app
          ln -s /Applications target/dmg-stage/Applications
          hdiutil create -srcfolder target/dmg-stage -volname "dpdf" -fs HFS+ -format UDZO -ov "dist/release/dpdf-2.0.0-macos-universal.dmg"

          # Package Universal ZIPs
          ditto -c -k --keepParent "$APP" "dist/release/dpdf-2.0.0-macos-universal.zip"
          mkdir -p target/cli-stage
          cp target/universal/release/dpdf-cli target/cli-stage/
          for f in README.md LICENSE-MIT LICENSE-APACHE NOTICE; do
            if [ -f "$f" ]; then cp "$f" target/cli-stage/; fi
          done
          ditto -c -k --keepParent target/cli-stage "dist/release/dpdf-cli-2.0.0-macos-universal.zip"

      - name: Upload macOS Installers
        uses: actions/upload-artifact@v7
        with:
          name: dpdf-macos-installers
          path: |
            dist/release/dpdf-*.dmg
            dist/release/dpdf-*.zip

  publish-release:
    name: Publish Release v2.0.0
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all installer artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/downloaded
          merge-multiple: true

      - name: Stage artifacts for release
        run: |
          mkdir -p dist/release
          cp dist/downloaded/* dist/release/
          ls -la dist/release/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.0' }}
          name: "dpdf ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.0' }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            dist/release/dpdf-*.exe
            dist/release/dpdf-*.msi
            dist/release/dpdf-*.dmg
            dist/release/dpdf-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
