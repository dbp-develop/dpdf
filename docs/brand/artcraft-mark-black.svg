<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Accent Gradient for 'd' Ribbon -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- Fold Corner Shadow -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- App Icon Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="docShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Container (Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#334155" stroke-width="3"/>

  <!-- Document Body Background -->
  <g filter="url(#docShadow)">
    <!-- Document shape with cut corner at top-right -->
    <path d="M 144 116 
             L 300 116 
             L 368 184 
             L 368 396 
             A 16 16 0 0 1 352 412 
             L 160 412 
             A 16 16 0 0 1 144 396 
             Z" 
          fill="#F8FAFC"/>

    <!-- Folded Corner Dog-Ear -->
    <path d="M 300 116 
             L 300 172 
             A 12 12 0 0 0 312 184 
             L 368 184 
             Z" 
          fill="url(#foldGrad)"/>
  </g>

  <!-- Lowercase 'd' Symbol inside Document -->
  <!-- Vertical stem of 'd' (forming a bookmark ribbon extending from top) -->
  <path d="M 276 170 
           L 308 170 
           A 6 6 0 0 1 314 176 
           L 314 346 
           A 6 6 0 0 1 308 352 
           L 282 352 
           A 6 6 0 0 1 276 346 
           Z" 
        fill="url(#accentGrad)"/>

  <!-- Circular bowl of lowercase 'd' -->
  <path d="M 280 252 
           A 48 48 0 1 0 280 348 
           Z" 
        fill="url(#accentGrad)"/>

  <!-- Inner cutout of 'd' bowl -->
  <ellipse cx="248" cy="300" rx="22" ry="22" fill="#F8FAFC"/>

  <!-- Small PDF indicator lines on document -->
  <rect x="180" y="170" width="60" height="8" rx="4" fill="#CBD5E1"/>
  <rect x="180" y="194" width="40" height="8" rx="4" fill="#CBD5E1"/>
</svg>
